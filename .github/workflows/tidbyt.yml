# Pushes the Tidbyt apps from GitHub's servers, so no home PC is needed.
# Secrets (Settings > Secrets and variables > Actions): TIDBYT_API_TOKEN, TIDBYT_DEVICE_ID.
# GitHub starts scheduled runs late: on this repo they arrive every 1-4 hours, not every 5 minutes.
# So the "ticker" job at the bottom keeps time itself: it runs for hours and starts the other jobs on
# the minute with workflow_dispatch ("tick-..." groups, which behave like the schedules they replace).
# The cron lines stay as the fallback that (re)starts the ticker.
name: Tidbyt

on:
  schedule:
    - cron: "1-59/5 8-23 * * 1-5"   # market, every 5 min (script keeps 04:00-20:00 ET weekdays)
    - cron: "1-59/5 0 * * 2-6"      # market, evening hour that falls after midnight UTC in winter
    - cron: "33 * * * *"            # market hourly (nights, weekends: CLOSED cards stay current)
    - cron: "7-59/15 * * * *"       # weather, Pixel Museum, Pixel Aquarium, Astros News, Astros GameDay, TV feed: every 15 min
  workflow_dispatch:
    inputs:
      group:
        description: "Which apps to push now"
        type: choice
        options: [market, weather, movies, stars, lake, gameday, feed, all, ticker, tick-market, tick-quarter, tick-hourly]
        default: all

permissions:
  contents: read
  actions: write   # lets the keepalive step stop GitHub disabling the schedule after 60 quiet days

env:
  PIXLET_VERSION: "0.34.0"

jobs:
  market:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.group == 'market' || github.event.inputs.group == 'all') ||
      github.event.schedule == '1-59/5 8-23 * * 1-5' ||
      github.event.schedule == '1-59/5 0 * * 2-6' ||
      github.event.schedule == '33 * * * *' ||
      github.event.inputs.group == 'tick-market' || github.event.inputs.group == 'tick-hourly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: market, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixlet
      - name: Restore last good market snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/marketpulse_snapshot.json
          key: mp-snapshot-${{ github.run_id }}
          restore-keys: mp-snapshot-
      - name: Fetch, render and push
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          MP_PAGE: ${{ github.run_number }}
          # by hand: always push. Hourly (schedule or tick): only outside market hours. Otherwise: only in market hours.
          MODE: ${{ (github.event.inputs.group == 'market' || github.event.inputs.group == 'all') && '--force' || ((github.event.schedule == '33 * * * *' || github.event.inputs.group == 'tick-hourly') && '--hourly' || '') }}
        run: python tools/cloud_push.py market $MODE
      - name: Save market snapshot
        if: always() && hashFiles('.cache/marketpulse_snapshot.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/marketpulse_snapshot.json
          key: mp-snapshot-${{ github.run_id }}
      - name: Keep the schedule alive
        if: github.event.schedule == '33 * * * *' || github.event.inputs.group == 'tick-hourly'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tidbyt.yml/enable"

  movies:   # hourly: Now Playing, Astros Stars, Lake Travis
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.group == 'movies' || github.event.inputs.group == 'stars' || github.event.inputs.group == 'lake' || github.event.inputs.group == 'all') ||
      github.event.schedule == '33 * * * *' || github.event.inputs.group == 'tick-hourly'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency: { group: movies, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixlet
      - run: pip install --quiet pillow
      - name: Restore IMDb ratings file and last movie list
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: movies-${{ github.run_id }}
          restore-keys: movies-
      - name: Now Playing
        if: github.event.inputs.group != 'stars' && github.event.inputs.group != 'lake'
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python tools/cloud_push.py movies
      - name: Astros Stars
        if: always() && github.event.inputs.group != 'movies' && github.event.inputs.group != 'lake'
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
        run: python tools/cloud_push.py stars
      - name: Lake Travis
        if: always() && github.event.inputs.group != 'movies' && github.event.inputs.group != 'stars'
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
        run: python tools/cloud_push.py lake
      - name: Save movie cache
        if: always() && (hashFiles('.cache/now_playing.json') != '' || hashFiles('.cache/astros_stars.json') != '' || hashFiles('.cache/lake_travis.json') != '')
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: movies-${{ github.run_id }}

  weather:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.group == 'weather' || github.event.inputs.group == 'all') ||
      github.event.schedule == '7-59/15 * * * *' || github.event.inputs.group == 'tick-quarter'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency: { group: weather, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixlet
      - name: Render and push
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
        run: python tools/cloud_push.py weather

  feed:   # pictures for the Android TV mirror app (android_tv/), published to the mirror-feed branch
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.group == 'feed' || github.event.inputs.group == 'all') ||
      github.event.schedule == '7-59/15 * * * *' || github.event.inputs.group == 'tick-quarter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # to push the mirror-feed branch
    concurrency: { group: feed, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixlet
      - run: pip install --quiet pillow
      - name: Week number (the cache below is renewed weekly)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore store apps and IMDb ratings
        uses: actions/cache@v4
        with:
          path: |
            .cache/community
            .cache/imdb
          key: feed-${{ steps.week.outputs.week }}
          restore-keys: feed-
      - name: Render every app
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python tools/tidbyt_mirror.py --feed feed
      - name: Publish to the mirror-feed branch (one commit, replaced each time)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd feed
          git init -q -b mirror-feed
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Tidbyt Mirror picture feed"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mirror-feed

  gameday:   # stays running through a game (up to ~6 h), pushing the live score every 90 s
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.group == 'gameday' || github.event.inputs.group == 'all') ||
      github.event.schedule == '7-59/15 * * * *' || github.event.inputs.group == 'tick-quarter'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency: { group: gameday, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixlet
      - name: Render and push (follow a game when one is near)
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
        run: python tools/cloud_push.py gameday --follow

  ticker:   # the clock: starts the other jobs on time, because GitHub's own schedule arrives hours late
    # Any scheduled run (or "ticker" by hand) starts one. Only one runs at a time: a second waits in the
    # concurrency group and takes over when the first ends after ~5.5 hours, so the chain never stops.
    if: github.event_name == 'schedule' || github.event.inputs.group == 'ticker'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency: { group: ticker, cancel-in-progress: false }
    env:
      GH_TOKEN: ${{ github.token }}   # workflow_dispatch is the one event this token may trigger
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Tick every 5 minutes
        run: |
          start() { gh workflow run tidbyt.yml --ref "${GITHUB_REF_NAME}" -f group="$1" || echo "could not start $1"; }
          end=$((SECONDS + 330 * 60))
          k=0
          while [ "$SECONDS" -lt "$end" ]; do
            start tick-market                               # every 5 min (the script itself skips closed hours)
            if [ $((k % 3)) -eq 1 ]; then start tick-quarter; fi   # every 15 min: weather, news, gameday, TV feed
            if [ $((k % 12)) -eq 2 ]; then start tick-hourly; fi   # every hour: movies, stars, closed-market cards
            k=$((k + 1))
            sleep 300
          done
      - name: Hand over to the next ticker
        if: always()
        run: gh workflow run tidbyt.yml --ref "${GITHUB_REF_NAME}" -f group=ticker
